<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            /* Координаты для точного попадания в экран ipadnew2.png */
            --v-top: 5.6%;    
            --v-left: 4.7%;   
            --v-width: 90.6%; 
            --v-height: 88.8%;
            --v-round: 20px;
            --gold: #D4AF37;
            --beige: #FDFBF7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }

        .ipad-wrapper {
            position: relative;
            width: 100%;
            /* Соотношение сторон картинки ipadnew2.png (примерно 16:9) */
            aspect-ratio: 16 / 9; 
            line-height: 0;
        }

        /* РАМКА АЙПАДА: Поверх видео */
        .ipad-mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            object-fit: fill;
        }

        /* ЭКРАН: Под рамкой */
        .screen-area {
            position: absolute;
            top: var(--v-top);
            left: var(--v-left);
            width: var(--v-width);
            height: var(--v-height);
            background: #000; 
            overflow: hidden;
            border-radius: var(--v-round);
            z-index: 1;
        }

        /* ВИДЕО: Растягивается на весь экран области */
        video { 
            width: 100%; 
            height: 100%; 
            /* cover — растягивает видео, заполняя всё пространство без полос */
            object-fit: cover; 
            cursor: pointer; 
        }

        /* ЦЕНТРАЛЬНАЯ КНОПКА PLAY */
        .play-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            width: 80px; height: 80px;
            background: rgba(212, 175, 55, 0.9);
            border: 2px solid var(--beige);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .play-overlay svg { fill: var(--beige); width: 35px; margin-left: 5px; }
        .playing .play-overlay { opacity: 0; pointer-events: none; }

        /* НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ */
        .controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 21;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .screen-area:hover .controls-bar {
            transform: translateY(0);
        }

        .btn-control {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0;
        }

        .btn-control svg { fill: var(--gold); width: 24px; height: 24px; }

        .progress-container {
            flex-grow: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            background: var(--gold);
            width: 0%;
            border-radius: 3px;
        }

        .time-display {
            color: #fff;
            font-size: 13px;
            font-family: monospace;
            min-width: 85px;
        }
    </style>
</head>
<body>

<div class="main-container" id="player">
    <div class="ipad-wrapper">
        <img src="ipadnew2.png" class="ipad-mask" alt="iPad">
        
        <div class="screen-area">
            <div class="play-overlay" id="bigPlayBtn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>

            <video id="v0" playsinline>
                <source src="https://github.com/grigoryevalexandra-lgtm/interactive2/raw/refs/heads/main/Avatar_IV_Video (3).mp4" type="video/mp4">
            </video>

            <div class="controls-bar">
                <button class="btn-control" id="playPauseBtn">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <div class="progress-container" id="progressCont">
                    <div class="progress-filled" id="progressFill"></div>
                </div>

                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('v0');
    const container = document.getElementById('player');
    const bigPlayBtn = document.getElementById('bigPlayBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressFill = document.getElementById('progressFill');
    const progressCont = document.getElementById('progressCont');
    const currTimeText = document.getElementById('currentTime');
    const durTimeText = document.getElementById('duration');

    function togglePlay() {
        if (video.paused) {
            video.play();
            container.classList.add('playing');
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        } else {
            video.pause();
            container.classList.remove('playing');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        }
    }

    bigPlayBtn.onclick = togglePlay;
    playPauseBtn.onclick = togglePlay;
    video.onclick = togglePlay;

    video.ontimeupdate = () => {
        const percent = (video.currentTime / video.duration) * 100;
        progressFill.style.width = percent + '%';
        currTimeText.textContent = formatTime(video.currentTime);
        if (!isNaN(video.duration)) {
            durTimeText.textContent = formatTime(video.duration);
        }
    };

    progressCont.onclick = (e) => {
        const rect = progressCont.getBoundingClientRect();
        const pos = (e.pageX - rect.left) / rect.width;
        video.currentTime = pos * video.duration;
    };

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' + sec : sec}`;
    }
</script>

</body>
</html>
