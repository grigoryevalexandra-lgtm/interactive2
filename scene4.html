<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --v-top: 7.2%;    
            --v-left: 5.2%;   
            --v-width: 89.6%; 
            --v-height: 85.6%;
            --v-round: 20px;
            --gold: #D4AF37;
            --beige: #FDFBF7;
            --green: #2ecc71; /* Цвет для LIKE */
            --red: #e74c3c;   /* Цвет для DISLIKE */
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .ipad-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            z-index: 2;
        }

        .ipad-mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            object-fit: contain;
        }

        .screen-area {
            position: absolute;
            top: var(--v-top);
            left: var(--v-left);
            width: var(--v-width);
            height: var(--v-height);
            background: #000; 
            overflow: hidden;
            border-radius: var(--v-round);
            z-index: 1;
        }

        /* ЦЕНТРАЛЬНАЯ КНОПКА PLAY */
        .play-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            width: 70px; height: 70px;
            background: rgba(212, 175, 55, 0.85);
            border: 2px solid var(--beige);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .play-overlay svg { fill: var(--beige); width: 30px; margin-left: 4px; }
        .playing .play-overlay { opacity: 0; pointer-events: none; }
        /* Скрываем центральный плей, если показан экран концовки */
        .ended .play-overlay { display: none; }

        /* НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ */
        .controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 21;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .screen-area:hover .controls-bar, .paused .controls-bar {
            transform: translateY(0);
        }
        
        /* Скрываем управление, если видео закончилось */
        .ended .controls-bar { transform: translateY(100%) !important; }

        .btn-control {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gold);
            display: flex;
            align-items: center;
            padding: 0;
        }

        .btn-control svg { fill: var(--gold); width: 24px; height: 24px; }

        .progress-container {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            background: var(--gold);
            width: 0%;
            border-radius: 2px;
        }

        .time-display {
            color: #fff;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            min-width: 75px;
        }

        .video-track { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }

        /* --- ЭКРАН КОНЦОВКИ (LIKE/DISLIKE) --- */
        .end-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); /* Полупрозрачный фон поверх видео */
            z-index: 30; /* Выше всего */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Расстояние между блоками */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        /* Показываем экран, когда у контейнера класс .ended */
        .ended .end-screen {
            opacity: 1;
            pointer-events: auto;
        }

        .end-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            color: #fff;
            font-family: 'Inter', sans-serif;
            transition: transform 0.2s ease;
        }

        .end-btn:hover {
            transform: scale(1.05);
        }

        .end-btn span {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        /* Стили для LIKE (лево) */
        .btn-like .icon-circle {
            background: rgba(46, 204, 113, 0.2);
            border-color: var(--green);
        }
        .btn-like svg { fill: var(--green); width: 40px; height: 40px; }
        .btn-like:hover .icon-circle { background: var(--green); }
        .btn-like:hover svg { fill: #fff; }

        /* Стили для DISLIKE (право) */
        .btn-dislike .icon-circle {
            background: rgba(231, 76, 60, 0.2);
            border-color: var(--red);
        }
        .btn-dislike svg { fill: var(--red); width: 40px; height: 40px; transform: scaleY(-1); } /* Отражаем палец вниз */
        .btn-dislike:hover .icon-circle { background: var(--red); }
        .btn-dislike:hover svg { fill: #fff; }

    </style>
</head>
<body>

<div class="main-container" id="player">
    <div class="ipad-wrapper">
        <img src="ipad2.png" class="ipad-mask" alt="iPad">
        
        <div class="screen-area" id="screen">
            <div class="end-screen" id="endScreen">
                <button class="end-btn btn-like" onclick="handleReaction('like')">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
                    </div>
                    <span>Понравилось</span>
                </button>

                <button class="end-btn btn-dislike" onclick="handleReaction('dislike')">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
                    </div>
                    <span>Не понравилось</span>
                </button>
            </div>

            <div class="play-overlay" id="bigPlayBtn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>

            <div class="video-track">
                <video id="v0" playsinline>
                    <source src="https://github.com/grigoryevalexandra-lgtm/interactive2/raw/refs/heads/main/Avatar_IV_Video.mp4" type="video/mp4">
                </video>
            </div>

            <div class="controls-bar">
                <button class="btn-control" id="playPauseBtn">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <div class="progress-container" id="progressCont">
                    <div class="progress-filled" id="progressFill"></div>
                </div>

                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('v0');
    const container = document.getElementById('player');
    const bigPlayBtn = document.getElementById('bigPlayBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressCont = document.getElementById('progressCont');
    const progressFill = document.getElementById('progressFill');
    const currTimeText = document.getElementById('currentTime');
    const durTimeText = document.getElementById('duration');

    function togglePlay() {
        // Если видео закончилось, клик по экрану (кроме кнопок) ничего не делает
        if (container.classList.contains('ended')) return;

        if (video.paused) {
            video.play();
            container.classList.add('playing');
            container.classList.remove('paused');
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        } else {
            video.pause();
            container.classList.remove('playing');
            container.classList.add('paused');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        }
    }

    // Событие завершения видео: показываем кнопки
    video.onended = () => {
        container.classList.remove('playing');
        container.classList.remove('paused');
        container.classList.add('ended'); // Добавляем класс конца видео
    };

    // Функция обработки нажатия на Like/Dislike
    function handleReaction(type) {
        if (type === 'like') {
            alert('Спасибо! Рады, что вам понравилось 👍');
        } else {
            alert('Жаль, мы будем стараться лучше 👎');
        }
        // Здесь можно добавить логику отправки данных на сервер или перезапуска видео
        // resetPlayer(); 
    }

    // Вспомогательная функция для сброса плеера (если нужно)
    function resetPlayer() {
        video.currentTime = 0;
        container.classList.remove('ended');
        container.classList.add('paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
    }

    bigPlayBtn.onclick = togglePlay;
    playPauseBtn.onclick = togglePlay;
    // Клик по видео работает только пока оно не закончилось
    video.onclick = () => {
        if (!container.classList.contains('ended')) togglePlay();
    };

    video.ontimeupdate = () => {
        if (isNaN(video.duration)) return;
        const percent = (video.currentTime / video.duration) * 100;
        progressFill.style.width = percent + '%';
        currTimeText.textContent = formatTime(video.currentTime);
        durTimeText.textContent = formatTime(video.duration);
    };

    // Загрузка метаданных для корректной длительности сразу
    video.onloadedmetadata = () => {
        durTimeText.textContent = formatTime(video.duration);
    };

    progressCont.onclick = (e) => {
        // Не даем перематывать, если выведен экран конца
        if (container.classList.contains('ended')) return;
        const rect = progressCont.getBoundingClientRect();
        const pos = (e.pageX - rect.left) / rect.width;
        video.currentTime = pos * video.duration;
    };

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' + sec : sec}`;
    }
</script>

</body>
</html>
