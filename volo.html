<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --v-top: 5.8%;    
            --v-left: 4.2%;   
            --v-width: 91.6%; 
            --v-height: 88.4%;
            --v-round: 20px;
            /* ВОТ ТВОИ ЦВЕТА */
            --green: #2ecc71; /* ЯРКО-ЗЕЛЕНЫЙ */
            --red: #e74c3c;   /* ЯРКО-КРАСНЫЙ */
            --blue: #3498db;
        }

        * { box-sizing: border-box; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; font-family: sans-serif; }

        .main-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 4 / 3; }

        .ipad-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; pointer-events: none; object-fit: contain; }

        .screen-area {
            position: absolute;
            top: var(--v-top); left: var(--v-left); width: var(--v-width); height: var(--v-height);
            background: #000; overflow: hidden; border-radius: var(--v-round); z-index: 1;
        }

        video { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }

        /* ЭКРАН ВЫБОРА */
        #choiceScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; 
            justify-content: center;
            align-items: center;
            gap: 80px;
            z-index: 99999;
        }

        .btn-ui {
            background: none; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            color: white; transition: 0.2s;
        }
        .btn-ui:hover { transform: scale(1.2); }
        .btn-ui svg { width: 120px; height: 120px; margin-bottom: 15px; }
        .btn-ui span { font-weight: bold; text-transform: uppercase; font-size: 20px; }

        /* ЦВЕТА ПАЛЬЦЕВ */
        .like svg { fill: var(--green); } 
        .dislike svg { fill: var(--red); transform: scaleY(-1); } 

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 600; cursor: pointer; }
        .overlay svg { fill: #fff; width: 80px; }

        #restartScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100000; }
        .restart-btn { padding: 20px 40px; background: var(--blue); color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="volya-k-pobede-2-24e237.mp3" type="audio/mpeg">
</audio>

<div class="main-container">
    <img src="ipadnew3.png" class="ipad-mask">
    
    <div class="screen-area">
        <div id="startBtn" class="overlay" onclick="startPlay()">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>

        <div id="pauseBtn" class="overlay" style="display:none;" onclick="togglePause()">
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </div>

        <div id="choiceScreen">
            <button class="btn-ui like" onclick="makeChoice('like')">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
                <span>Понравилось</span>
            </button>
            <button class="btn-ui dislike" onclick="makeChoice('dislike')">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
                <span>Не понравилось</span>
            </button>
        </div>

        <div id="restartScreen">
            <button class="restart-btn" onclick="restart()">В начало</button>
        </div>

        <video id="videoPlayer" playsinline onclick="togglePause()">
            <source id="videoSrc" src="fin2.mp4" type="video/mp4">
        </video>
    </div>
</div>

<script>
    const video = document.getElementById('videoPlayer');
    const choiceScreen = document.getElementById('choiceScreen');
    const restartScreen = document.getElementById('restartScreen');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const bgMusic = document.getElementById('bgMusic');

    bgMusic.volume = 0.25;
    let choiceTriggered = false;

    function startPlay() {
        startBtn.style.display = 'none';
        video.play();
        bgMusic.play();
    }

    function togglePause() {
        if (choiceScreen.style.display === 'flex' || restartScreen.style.display === 'flex') return;
        if (video.paused) { 
            video.play(); 
            // Музыка включается при снятии с паузы ТОЛЬКО если это не видео Волошина
            if (!video.src.includes('voloshin.mp4')) {
                bgMusic.play(); 
            }
            pauseBtn.style.display = 'none'; 
        }
        else { 
            video.pause(); 
            bgMusic.pause(); 
            pauseBtn.style.display = 'flex'; 
        }
    }

    video.ontimeupdate = () => {
        if (!choiceTriggered && video.currentTime >= 8.5) {
            video.pause(); 
            // bgMusic.pause(); <-- УБРАЛИ. Теперь музыка продолжает играть, пока висят кнопки выбора
            video.currentTime = 8.5; 
            choiceTriggered = true;
            choiceScreen.style.display = 'flex';
            pauseBtn.style.display = 'none';
        }
    };

    video.onended = () => {
        if (video.src.includes('voloshin.mp4') || video.src.includes('fin3.mp4')) {
            restartScreen.style.display = 'flex';
            bgMusic.pause(); 
        }
    };

    function makeChoice(type) {
        choiceScreen.style.display = 'none';
        if (type === 'like') {
            video.src = 'fin3.mp4';
            video.load();
            video.play();
            bgMusic.play(); // Для хорошего сценария музыка играет дальше
        } else {
            video.src = 'voloshin.mp4';
            video.load();
            video.play();
            bgMusic.pause(); // ДЛЯ ВОЛОШИНА МУЗЫКУ ВЫКЛЮЧАЕМ НАГЛУХО
        }
    }

    function restart() {
        restartScreen.style.display = 'none';
        choiceTriggered = false;
        video.src = 'fin2.mp4';
        video.load();
        video.play();
        bgMusic.currentTime = 0; 
        bgMusic.play(); // При перезапуске возвращаем музыку
    }
</script>
</body>
</html>
