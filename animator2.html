<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            /* Твои точные координаты для вписывания видео в ipadnew2.png */
            --v-top: 5.6%;    
            --v-left: 4.7%;   
            --v-width: 90.6%; 
            --v-height: 88.8%;
            --v-round: 20px;
            --gold: #D4AF37;
            --graphite: #383838; 
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .video-player-root {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ipad-container {
            position: relative;
            width: 88%; 
            aspect-ratio: 1.77;
        }

        /* Экран с видео */
        .screen {
            position: absolute;
            top: var(--v-top);
            left: var(--v-left);
            width: var(--v-width);
            height: var(--v-height);
            z-index: 1;
            overflow: hidden;
            border-radius: var(--v-round);
            background: #000;
        }

        /* Идеальное выравнивание айфрейма внутри экрана */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Рамка айпада лежит сверху и пропускает клики сквозь себя */
        .ipad-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="video-player-root" id="player">
    <div class="ipad-container">
        
        <div class="screen" id="screenArea">
            <iframe src="https://rutube.ru/play/embed/ee71062e210f2ce42979634faed98c58" 
                    allow="clipboard-write; autoplay" 
                    webkitAllowFullScreen 
                    mozallowfullscreen 
                    allowFullScreen>
            </iframe>
        </div>

        <img src="ipadnew2.png" class="ipad-frame">

    </div>
</div>

</body>
</html>
